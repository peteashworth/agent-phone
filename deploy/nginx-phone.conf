# Inside the existing `server { server_name jasmine.ashworthhub.com; ... }` block.
# Keep the existing `location /phone/v1` (spike LLM stub on :3500) as is: nginx picks the longest prefix,
# so /phone/v1 still goes to the stub and everything else under /phone/ goes to the new server.
location /phone/ {
    proxy_pass http://127.0.0.1:3600;     # no trailing slash: keeps the /phone prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
}
